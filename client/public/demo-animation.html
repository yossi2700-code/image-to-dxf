<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DXFai — הדגמה חיה</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0916;
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  gap: 24px;
}

h1 {
  font-size: clamp(1.3rem,4vw,2rem);
  font-weight: 900;
  background: linear-gradient(135deg,#a5b4fc,#c4b5fd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
}
.sub { color:#6b7280; font-size:14px; text-align:center; }

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 32px 24px;
  width: 100%;
  max-width: 700px;
}

/* Steps row */
.steps {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  gap: 4px;
}
.step { flex:1; text-align:center; }
.step-circle {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(99,102,241,0.15);
  border: 1.5px solid rgba(99,102,241,0.3);
  color: #a5b4fc;
  font-weight: 700; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 6px;
  transition: all 0.4s;
}
.step-circle.active { background:#6366f1; border-color:#6366f1; color:#fff; box-shadow:0 0 14px rgba(99,102,241,0.5); }
.step-circle.done { background:#10b981; border-color:#10b981; color:#fff; }
.step-name { font-size:11px; color:#6b7280; transition:color 0.3s; }
.step-name.active { color:#a5b4fc; }
.step-name.done { color:#10b981; }
.step-arrow { color:#374151; font-size:20px; flex-shrink:0; padding-bottom:18px; }

/* Animation row */
.anim-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  min-height: 180px;
  flex-wrap: wrap;
}

.box {
  width: 140px; height: 140px;
  border-radius: 16px;
  display: flex; flex-direction:column;
  align-items: center; justify-content: center;
  gap: 8px;
  border: 2px solid rgba(99,102,241,0.25);
  background: rgba(99,102,241,0.06);
  transition: all 0.5s;
  flex-shrink: 0;
}
.box.glow { border-color:#6366f1; box-shadow:0 0 28px rgba(99,102,241,0.35); }
.box.green { border-color:#10b981; box-shadow:0 0 28px rgba(16,185,129,0.3); background:rgba(16,185,129,0.06); }
.box-label { font-size:11px; color:#6b7280; }

.arrow-wrap {
  display: flex; flex-direction:column;
  align-items: center; gap:4px;
  opacity:0; transition:opacity 0.5s;
}
.arrow-wrap.show { opacity:1; }
.arrow-line {
  width:50px; height:2px;
  background: linear-gradient(90deg,#6366f1,#8b5cf6);
  border-radius:2px;
  position:relative;
}
.arrow-line::after {
  content:'';
  position:absolute; right:-1px; top:-4px;
  border:5px solid transparent;
  border-left:8px solid #8b5cf6;
}
.arrow-sub { font-size:10px; color:#6b7280; white-space:nowrap; }

/* Spinner */
.spinner {
  width:36px; height:36px;
  border:3px solid rgba(99,102,241,0.2);
  border-top-color:#6366f1;
  border-radius:50%;
  animation: spin 0.8s linear infinite;
  display:none;
}
.spinner.on { display:block; }
@keyframes spin { to { transform:rotate(360deg); } }

/* DXF SVG paths */
.dxf-path {
  stroke:#10b981; stroke-width:1.5; fill:none;
  stroke-dasharray:500; stroke-dashoffset:500;
  transition: stroke-dashoffset 1.8s ease;
}
.dxf-path.draw { stroke-dashoffset:0; }

/* Progress */
.prog-wrap {
  height:4px; background:rgba(255,255,255,0.06);
  border-radius:2px; overflow:hidden;
  margin-top:20px; opacity:0; transition:opacity 0.3s;
}
.prog-wrap.show { opacity:1; }
.prog-fill {
  height:100%; background:linear-gradient(90deg,#6366f1,#8b5cf6);
  border-radius:2px; width:0%; transition:width 0.4s ease;
}

/* Status */
.status {
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:10px; padding:12px 16px;
  margin-top:16px; min-height:46px;
}
.dot {
  width:8px; height:8px; border-radius:50%;
  background:#374151; flex-shrink:0; transition:background 0.3s;
}
.dot.pulse { background:#6366f1; animation:pulse 1s infinite; }
.dot.done { background:#10b981; animation:none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.status-txt { font-size:13px; color:#9ca3af; transition:color 0.3s; }
.status-txt.on { color:#e5e7eb; }

/* Download btn */
.dl-btn {
  display:none; width:100%; margin-top:16px;
  padding:14px; background:linear-gradient(135deg,#10b981,#059669);
  border:none; border-radius:12px; color:#fff;
  font-size:15px; font-weight:700; cursor:pointer;
  transition:transform 0.2s, box-shadow 0.2s;
}
.dl-btn.show { display:block; animation:fadeUp 0.5s ease; }
.dl-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(16,185,129,0.35); }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* Play button */
#playBtn {
  display:block; width:100%; padding:16px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border:none; border-radius:14px; color:#fff;
  font-size:17px; font-weight:800; cursor:pointer;
  margin-top:20px;
  box-shadow:0 4px 20px rgba(99,102,241,0.4);
  transition:transform 0.15s, box-shadow 0.15s;
}
#playBtn:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(99,102,241,0.5); }
#playBtn:active { transform:scale(0.97); }
#playBtn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* Metrics */
.metrics {
  display:flex; gap:12px; flex-wrap:wrap;
  justify-content:center; width:100%; max-width:700px;
}
.metric {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:12px 18px;
  text-align:center; opacity:0; transform:translateY(8px);
  transition:all 0.5s; flex:1; min-width:120px;
}
.metric.show { opacity:1; transform:translateY(0); }
.metric-val { font-size:20px; font-weight:900; color:#a5b4fc; }
.metric-lbl { font-size:11px; color:#6b7280; margin-top:3px; }

/* Restart */
#restartBtn {
  display:none; background:none;
  border:1px solid rgba(255,255,255,0.12);
  color:#6b7280; padding:8px 22px;
  border-radius:8px; cursor:pointer;
  font-size:13px; transition:all 0.2s;
  margin-top:8px;
}
#restartBtn.show { display:inline-block; }
#restartBtn:hover { color:#9ca3af; border-color:rgba(255,255,255,0.25); }
</style>
</head>
<body>

<h1>✦ DXFai — הדגמה חיה</h1>
<p class="sub">לחץ על הכפתור וצפה כיצד תמונה הופכת לקובץ DXF</p>

<div class="card">

  <!-- Steps -->
  <div class="steps">
    <div class="step">
      <div class="step-circle" id="s1">1</div>
      <div class="step-name" id="s1n">העלאת תמונה</div>
    </div>
    <div class="step-arrow">→</div>
    <div class="step">
      <div class="step-circle" id="s2">2</div>
      <div class="step-name" id="s2n">AI מעבד</div>
    </div>
    <div class="step-arrow">→</div>
    <div class="step">
      <div class="step-circle" id="s3">3</div>
      <div class="step-name" id="s3n">DXF מוכן</div>
    </div>
  </div>

  <!-- Animation -->
  <div class="anim-row">

    <!-- Photo box -->
    <div class="box" id="photoBox">
      <svg width="70" height="70" viewBox="0 0 70 70" fill="none">
        <rect x="5" y="18" width="60" height="40" rx="6" stroke="#6366f1" stroke-width="1.8" fill="rgba(99,102,241,0.08)"/>
        <circle cx="35" cy="38" r="13" stroke="#8b5cf6" stroke-width="1.8" fill="rgba(139,92,246,0.08)"/>
        <circle cx="35" cy="38" r="7" stroke="#a5b4fc" stroke-width="1.5" fill="rgba(165,180,252,0.1)"/>
        <rect x="45" y="10" width="12" height="9" rx="3" stroke="#6366f1" stroke-width="1.5" fill="none"/>
        <rect x="8" y="21" width="10" height="7" rx="2" stroke="#6366f1" stroke-width="1.5" fill="none"/>
      </svg>
      <div class="box-label">תמונה מקורית</div>
    </div>

    <!-- Arrow 1 -->
    <div class="arrow-wrap" id="arr1">
      <div class="arrow-line"></div>
      <div class="arrow-sub">שולח ל-AI</div>
    </div>

    <!-- AI box -->
    <div class="box" id="aiBox" style="opacity:0.3;transform:scale(0.9);">
      <div class="spinner" id="spinner"></div>
      <div id="aiIcon" style="font-size:32px;">🤖</div>
      <div class="box-label" id="aiLbl">ממתין...</div>
    </div>

    <!-- Arrow 2 -->
    <div class="arrow-wrap" id="arr2">
      <div class="arrow-line"></div>
      <div class="arrow-sub">מייצר DXF</div>
    </div>

    <!-- DXF box -->
    <div class="box" id="dxfBox" style="opacity:0.3;transform:translateX(16px);">
      <svg width="100" height="100" viewBox="0 0 100 100">
        <path class="dxf-path" id="p1" d="M10 30 L10 80 Q10 85 15 85 L85 85 Q90 85 90 80 L90 30 Q90 25 85 25 L15 25 Q10 25 10 30 Z"/>
        <path class="dxf-path" id="p2" d="M50 55 m-16 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0"/>
        <path class="dxf-path" id="p3" d="M50 55 m-9 0 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0"/>
        <path class="dxf-path" id="p4" d="M58 18 L72 18 Q76 18 76 22 L76 27"/>
        <path class="dxf-path" id="p5" d="M13 28 L24 28 L24 34 L13 34 Z"/>
      </svg>
      <div class="box-label" style="color:#10b981;margin-top:-8px;">camera.dxf</div>
    </div>

  </div>

  <!-- Progress -->
  <div class="prog-wrap" id="prog">
    <div class="prog-fill" id="progFill"></div>
  </div>

  <!-- Status -->
  <div class="status">
    <div class="dot" id="dot"></div>
    <div class="status-txt" id="statusTxt">לחץ על הכפתור להתחיל הדגמה</div>
  </div>

  <!-- Download -->
  <button class="dl-btn" id="dlBtn">⬇ הורד קובץ DXF — camera.dxf (14 KB)</button>

  <!-- Play / Restart -->
  <button id="playBtn">▶ הפעל הדגמה</button>
  <div style="text-align:center">
    <button id="restartBtn">↺ הפעל שוב</button>
  </div>

</div>

<!-- Metrics -->
<div class="metrics">
  <div class="metric" id="m1"><div class="metric-val">3.2s</div><div class="metric-lbl">זמן עיבוד</div></div>
  <div class="metric" id="m2"><div class="metric-val">2,847</div><div class="metric-lbl">נקודות וקטור</div></div>
  <div class="metric" id="m3"><div class="metric-val">14 KB</div><div class="metric-lbl">גודל קובץ</div></div>
  <div class="metric" id="m4"><div class="metric-val">100%</div><div class="metric-lbl">תואם LightBurn</div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('playBtn').addEventListener('click', runDemo);
  document.getElementById('restartBtn').addEventListener('click', function(){ location.reload(); });
});

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function step(n, state){
  var c = document.getElementById('s'+n);
  var t = document.getElementById('s'+n+'n');
  c.className = 'step-circle ' + state;
  t.className = 'step-name ' + state;
}

function status(txt, pulse){
  var d = document.getElementById('dot');
  var t = document.getElementById('statusTxt');
  d.className = 'dot ' + (pulse==='pulse'?'pulse': pulse==='done'?'done':'');
  t.className = 'status-txt ' + (pulse?'on':'');
  t.textContent = txt;
}

function progress(pct){
  document.getElementById('progFill').style.width = pct+'%';
}

async function runDemo(){
  var btn = document.getElementById('playBtn');
  btn.disabled = true;
  btn.textContent = '⏳ מריץ הדגמה...';

  // show progress bar
  document.getElementById('prog').classList.add('show');

  // STEP 1
  step(1,'active');
  status('מעלה תמונה לשרת...','pulse');
  document.getElementById('photoBox').classList.add('glow');
  progress(15);
  await sleep(1100);

  // → STEP 2
  step(1,'done');
  document.getElementById('arr1').classList.add('show');
  progress(30);
  await sleep(400);

  step(2,'active');
  var ai = document.getElementById('aiBox');
  ai.style.opacity='1'; ai.style.transform='scale(1)';
  ai.classList.add('glow');
  document.getElementById('aiIcon').style.display='none';
  document.getElementById('spinner').classList.add('on');
  document.getElementById('aiLbl').textContent='מנתח...';
  status('ה-AI מנתח את התמונה...','pulse');
  progress(45);
  await sleep(800);

  status('מזהה קצוות וצורות...','pulse');
  progress(55);
  await sleep(700);

  status('בונה נתיבי וקטור...','pulse');
  progress(65);
  await sleep(700);

  status('מבצע אופטימיזציה...','pulse');
  progress(78);
  await sleep(700);

  // AI done
  document.getElementById('spinner').classList.remove('on');
  document.getElementById('aiIcon').style.display='block';
  document.getElementById('aiIcon').textContent='✅';
  document.getElementById('aiLbl').textContent='הושלם!';
  step(2,'done');
  progress(85);
  await sleep(500);

  // STEP 3
  step(3,'active');
  document.getElementById('arr2').classList.add('show');
  status('מייצר קובץ DXF...','pulse');
  progress(92);
  await sleep(400);

  var dxf = document.getElementById('dxfBox');
  dxf.style.opacity='1'; dxf.style.transform='translateX(0)';
  dxf.classList.add('green');

  // draw paths
  var paths = ['p1','p2','p3','p4','p5'];
  for(var i=0;i<paths.length;i++){
    document.getElementById(paths[i]).classList.add('draw');
    await sleep(280);
  }

  progress(100);
  step(3,'done');
  status('✓ קובץ DXF מוכן להורדה!','done');

  // show download
  await sleep(300);
  document.getElementById('dlBtn').classList.add('show');

  // metrics
  await sleep(200);
  ['m1','m2','m3','m4'].forEach(function(id,i){
    setTimeout(function(){ document.getElementById(id).classList.add('show'); }, i*120);
  });

  // restart
  await sleep(500);
  document.getElementById('restartBtn').classList.add('show');
  btn.style.display='none';
}
</script>
</body>
</html>
